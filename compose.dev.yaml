services:
  rails1:
    volumes: [".:/app", "../../Laravel/laravel-cloud-rails:/gem"]
    command: ["sh", "-c", "git config --global --add safe.directory /gem && bundle config set local.rails-on-cloud /gem && bundle exec puma -C config/puma.rb"]
  rails2:
    volumes: [".:/app", "../../Laravel/laravel-cloud-rails:/gem"]
    command: ["sh", "-c", "git config --global --add safe.directory /gem && bundle config set local.rails-on-cloud /gem && bundle exec puma -C config/puma.rb"]
