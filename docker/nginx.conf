events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream rails { zone rails 64k; server rails1:3000 resolve; server rails2:3000 resolve; }
  upstream reverb { zone reverb 64k; server reverb:8080 resolve; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    listen 3108;
    listen 3443 ssl;
    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;
    location = /cable { proxy_pass http://rails; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 90s; }
    location /app/ { proxy_pass http://reverb; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 90s; }
    location /apps/ { proxy_pass http://reverb; }
    location / { proxy_pass http://rails; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
