port 0
tls-port 6379
tls-cert-file /certs/valkey.pem
tls-key-file /certs/valkey.key
tls-ca-cert-file /certs/ca.pem
tls-auth-clients no
user default off
user demo reset on >cloud-demo-valkey ~roc:broker:* +auth +hello +ping +quit +select +client|setname +client|setinfo +eval +hget +hset +hincrby +del +time +rpush +ltrim +expire +lrange
maxmemory 64mb
maxmemory-policy allkeys-lru
save ""
appendonly no
